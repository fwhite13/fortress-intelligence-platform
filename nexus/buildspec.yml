version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "Building commit:" && git log -1 --oneline
      - echo "IMAGE_TAG=$IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - echo Building Docker image...
      - docker build -f nexus/Dockerfile -t nexus-web:$IMAGE_TAG .
      - docker tag nexus-web:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nexus-web:latest
      - docker tag nexus-web:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nexus-web:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nexus-web:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/nexus-web:$IMAGE_TAG
      - echo Registering new ECS task definition revision...
      - TASK_DEF=$(aws ecs describe-task-definition --task-definition nexus-web --region $AWS_DEFAULT_REGION --query 'taskDefinition' --output json)
      - NEW_TASK_DEF=$(echo "$TASK_DEF" | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection, .deregisteredAt)' | jq '(.containerDefinitions[] | select(.name == "nexus-web") | .image) |= "'$AWS_ACCOUNT_ID'.dkr.ecr.'$AWS_DEFAULT_REGION'.amazonaws.com/nexus-web:'$IMAGE_TAG'"')
      - NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --region $AWS_DEFAULT_REGION --query 'taskDefinition.taskDefinitionArn' --output text)
      - echo "New task def registered: $NEW_TASK_DEF_ARN"
      - echo Updating ECS service with new task definition...
      - aws ecs update-service --cluster fortress-tools-cluster --service nexus-web --task-definition $NEW_TASK_DEF_ARN --region $AWS_DEFAULT_REGION
      - echo Waiting for service stability...
      - aws ecs wait services-stable --cluster fortress-tools-cluster --services nexus-web --region $AWS_DEFAULT_REGION
      - echo Deploy complete

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: 742932328420
