version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "Building commit $IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - docker build -f meetings/transcriber/Dockerfile --build-arg HF_TOKEN=$HF_TOKEN -t firm-transcriber:$IMAGE_TAG meetings/transcriber/
      - docker tag firm-transcriber:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:latest
      - docker tag firm-transcriber:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:$IMAGE_TAG
  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:$IMAGE_TAG
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:$IMAGE_TAG
      - echo Registering new Batch job definition...
      - |
        JOB_DEF=$(aws batch describe-job-definitions --job-definition-name firm-transcription-job --status ACTIVE \
          --query "jobDefinitions | sort_by(@, &revision) | [-1]" --output json)
        CONTAINER_PROPS=$(echo $JOB_DEF | python3 -c "import json,sys; d=json.load(sys.stdin); d['image']='$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-transcriber:latest'; print(json.dumps(d))")
        NEW_JOB_DEF=$(aws batch register-job-definition --job-definition-name firm-transcription-job \
          --type container \
          --container-properties "$CONTAINER_PROPS" \
          --region $AWS_DEFAULT_REGION \
          --query 'jobDefinitionArn' --output text)
        echo "Registered Batch job def: $NEW_JOB_DEF"
        NEW_REV=$(echo $NEW_JOB_DEF | grep -oP ':\K[0-9]+$')
        echo "New revision: $NEW_REV"
      - echo Deploy complete.

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "742932328420"
