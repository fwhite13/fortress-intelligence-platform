version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "Building commit $IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - docker build -f meetings/vpbot/Dockerfile -t firm-vpbot:$IMAGE_TAG meetings/vpbot/
      - docker tag firm-vpbot:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-vpbot:latest
      - docker tag firm-vpbot:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-vpbot:$IMAGE_TAG
  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-vpbot:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-vpbot:$IMAGE_TAG
      - echo Updating ECS service...
      - TASK_DEF=$(aws ecs describe-task-definition --task-definition firm-vpbot --query 'taskDefinition' --output json)
      - NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "import json,sys; td=json.load(sys.stdin); td['containerDefinitions'][0]['image']='$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/firm-vpbot:$IMAGE_TAG'; [td.pop(k,None) for k in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']]; print(json.dumps(td))")
      - NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
      - echo "Registered new task def $NEW_TASK_DEF_ARN"
      - aws ecs update-service --cluster fortress-tools-cluster --service meetings-vpbot-dev --task-definition $NEW_TASK_DEF_ARN --force-new-deployment --region $AWS_DEFAULT_REGION
      - echo Deploy complete.

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "742932328420"
