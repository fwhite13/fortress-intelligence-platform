version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "Building harness commit:" && git log -1 --oneline
      - echo "HARNESS_IMAGE_TAG=$IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - echo Building harness Docker image...
      - docker build --no-cache -f fait/agent-harness/Dockerfile -t fait-v2-agent-harness:$IMAGE_TAG fait/agent-harness/
      - docker tag fait-v2-agent-harness:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fait-v2-agent-harness:$IMAGE_TAG
      - docker tag fait-v2-agent-harness:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fait-v2-agent-harness:harness-latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing harness Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fait-v2-agent-harness:$IMAGE_TAG
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fait-v2-agent-harness:harness-latest

      # ADO#4865 — Register new ECS task definition with updated image
      - echo Registering harness ECS task definition...
      - |
        CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition fait-v2-agent-harness \
          --region $AWS_DEFAULT_REGION \
          --query 'taskDefinition' \
          --output json)

        NEW_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fait-v2-agent-harness:$IMAGE_TAG"

        # Strip ECS-managed fields, update image
        NEW_TASK_DEF=$(echo $CURRENT_TASK_DEF | python3 -c "
import json, sys
td = json.load(sys.stdin)
# Remove ECS-managed readonly fields
for k in ['taskDefinitionArn','revision','status','requiresAttributes','placementConstraints','compatibilities','registeredAt','registeredBy']:
    td.pop(k, None)
# Update container image
for c in td.get('containerDefinitions', []):
    if 'fait-v2-agent-harness' in c.get('image',''):
        c['image'] = sys.argv[1]
print(json.dumps(td))
" "$NEW_IMAGE")

        NEW_REVISION=$(aws ecs register-task-definition \
          --region $AWS_DEFAULT_REGION \
          --cli-input-json "$NEW_TASK_DEF" \
          --query 'taskDefinition.revision' \
          --output text)

        echo "Registered fait-v2-agent-harness:$NEW_REVISION"
        echo "HARNESS_REVISION=$NEW_REVISION" >> harness-revision.txt
      - echo Harness task definition registered.

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: 742932328420
