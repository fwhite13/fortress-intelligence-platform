version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "Building commit:" && git log -1 --oneline
      - echo "IMAGE_TAG=$IMAGE_TAG"
  build:
    commands:
      - echo Build started on `date`
      - echo Building Docker image...
      - docker build -f fait/Dockerfile -t fred-chat:$IMAGE_TAG .
      - docker tag fred-chat:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fred-chat:kb-latest
      - docker tag fred-chat:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fred-chat:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fred-chat:kb-latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fred-chat:$IMAGE_TAG

      # ADO#4865 — Register updated fred-dev task definition before updating service
      - echo Registering fred-dev task definition...
      - |
        CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition fred-dev \
          --region $AWS_DEFAULT_REGION \
          --query 'taskDefinition' \
          --output json)

        NEW_BLAZOR_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/fred-chat:$IMAGE_TAG"

        # Read harness revision from env var or detect latest registered
        if [ -z "$HARNESS_REVISION" ]; then
          HARNESS_REVISION=$(aws ecs describe-task-definition \
            --task-definition fait-v2-agent-harness \
            --region $AWS_DEFAULT_REGION \
            --query 'taskDefinition.revision' \
            --output text)
          echo "HARNESS_REVISION not in env, using latest registered: $HARNESS_REVISION"
        fi

        NEW_TASK_DEF=$(echo $CURRENT_TASK_DEF | python3 -c "
import json, sys
td = json.load(sys.stdin)
for k in ['taskDefinitionArn','revision','status','requiresAttributes','placementConstraints','compatibilities','registeredAt','registeredBy']:
    td.pop(k, None)
blazer_image, harness_rev = sys.argv[1], sys.argv[2]
for c in td.get('containerDefinitions', []):
    if 'fred-chat' in c.get('image',''):
        c['image'] = blazer_image
    # Update Fargate__TaskDefinition env var
    for env in c.get('environment', []):
        if env['name'] == 'Fargate__TaskDefinition':
            env['value'] = f'fait-v2-agent-harness:{harness_rev}'
print(json.dumps(td))
" "$NEW_BLAZOR_IMAGE" "$HARNESS_REVISION")

        NEW_FRED_DEV_REVISION=$(aws ecs register-task-definition \
          --region $AWS_DEFAULT_REGION \
          --cli-input-json "$NEW_TASK_DEF" \
          --query 'taskDefinition.revision' \
          --output text)

        echo "Registered fred-dev:$NEW_FRED_DEV_REVISION"
      - echo Updating ECS service to fred-dev:$NEW_FRED_DEV_REVISION...
      - aws ecs update-service --cluster fortress-tools-cluster --service fred-dev --task-definition fred-dev:$NEW_FRED_DEV_REVISION --force-new-deployment --region $AWS_DEFAULT_REGION
      - echo Deploy triggered

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: 742932328420
